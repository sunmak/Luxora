services:
  postgres:
    image: postgres:17-alpine
    container_name: luxora-postgres
    environment:
      POSTGRES_USER: luxora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxora_dev}
      POSTGRES_DB: luxora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxora -d luxora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
    name: luxora-postgres-data
